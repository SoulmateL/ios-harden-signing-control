name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check pinned age contract
        run: bash Tests/age_tool_contract_test.sh

      - name: Install pinned age
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/install_pinned_age.sh --destination "$RUNNER_TEMP/age-v1.3.1"

      - name: Test encrypted recovery round trip
        run: bash Tests/recovery_roundtrip_test.sh --age "$RUNNER_TEMP/age-v1.3.1/age"

      - name: Test Swift package
        run: swift test

      - name: Check workflow contract
        run: bash Tests/workflow_contract_test.sh

      - name: Check Seatbelt contract
        run: bash Tests/sandbox_contract_test.sh

      - name: Check production bootstrap gate
        run: |
          bash Tests/bootstrap_contract_test.sh
          bash Tests/restore_secret_contract_test.sh

      - name: Check fixture end-to-end contract
        run: bash Tests/fixture_e2e_contract_test.sh

      - name: Scan repository
        run: bash Scripts/validate_repository.sh
